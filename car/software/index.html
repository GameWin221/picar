<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Steering Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="camera-container">
        <iframe id="camera-feed" src="" scrolling="no" style="width: 100vw; height: 65vh;"></iframe>
    </div>
    <div class="controller">
        <div class="slider-container">
            <label for="slider1">Steering (-30deg to 30deg): </label>
            <input class="slider" type="range" id="slider1" min="-30" max="30" value="0" style="width: 20rem;">
            <span id="slider1-value">0deg</span><br>
        </div>

        <div class="slider-container">
            <label for="slider2">Motors (-100% to 100%): </label>
            <input class="slider" type="range" id="slider2" min="-100" max="100" value="0" style="width: 20rem;">
            <span id="slider2-value">0%</span><br>
        </div>

        <div class="slider-container">
            <label for="slider3">Motor PWM Frequency (1000 - 20000): </label>
            <input class="slider" type="range" id="slider3" min="1000" max="20000" value="12000" style="width: 20rem;">
            <span id="slider3-value">12000</span><br>
        </div>
    </div> 
</body>
<script>
    const WEBSOCKET_ADDR = "ws://" + window.location.hostname + ":8080";
    const WEBRTC_CAMERA_ADDR = "http://" + window.location.hostname + ":8889/rpi";

    const socket = new WebSocket(WEBSOCKET_ADDR);

    let gamepadHandlerInterval = null;
    let isConnected = false;

    const slider1 = document.getElementById("slider1");
    const slider1Value = document.getElementById("slider1-value");

    const slider2 = document.getElementById("slider2");
    const slider2Value = document.getElementById("slider2-value");

    const slider3 = document.getElementById("slider3");
    const slider3Value = document.getElementById("slider3-value");

    const cameraFeed = document.getElementById("camera-feed");

    function setSteering(value) {
        if (!isConnected) return;

        slider1.value = value;
        slider1Value.textContent = slider1.value + 'deg';
        socket.send("steer " + slider1.value);
    }

    function setMotors(value) {
        if (!isConnected) return;

        slider2.value = value;
        slider2Value.textContent = slider2.value + '%';
        socket.send("motors " + slider2.value);
    }

    function setMotorPWMFrequency(value) {
        if (!isConnected) return;

        slider3.value = value;
        slider3Value.textContent = slider3.value;
        socket.send("motorfreq " + slider3.value);
    }

    function setIsConnected(value) {
        isConnected = value;

        slider1.disabled = !isConnected;
        slider2.disabled = !isConnected;
        slider3.disabled = !isConnected;
        if (isConnected) {
            cameraFeed.src = WEBRTC_CAMERA_ADDR;
        } else {
            cameraFeed.src = "";
        }
    }

    function gamepadHandler() {
        const gamepads = navigator.getGamepads();
        const gamepad = gamepads[0];

        if (!gamepad) {
            return;
        }

        const leftTrigger = gamepad.buttons[6].value;
        const rightTrigger = gamepad.buttons[7].value;

        const leftStickX = gamepad.axes[0];
        const leftStickY = gamepad.axes[1];
        const rightStickX = gamepad.axes[2];
        const rightStickY = gamepad.axes[3];
        
        setSteering(leftStickX * 30.0);
        setMotors((rightTrigger - leftTrigger) * 100.0);
        //console.log("LStick: (" + leftStickX.toFixed(2) + ", " + leftStickY.toFixed(2) + "),\nRStick: (" + rightStickX.toFixed(2) + ", " + rightStickY.toFixed(2) + "),\nLTrigger: " + leftTrigger.toFixed(2) + ", RTrigger: " + rightTrigger.toFixed(2))
    }
    
    setIsConnected(false);

    slider1.addEventListener("input", function() {
        setSteering(slider1.value)
    });

    slider2.addEventListener("input", function() {
        setMotors(slider2.value);
    });

    slider3.addEventListener("input", function() {
        setMotorPWMFrequency(slider3.value);
    });

    socket.addEventListener("open", (event) => {
        console.log("Connected to the robot");
        setIsConnected(true);
    });
    socket.addEventListener("close", (event) => {
        console.log("Disconnected from the robot");
        setIsConnected(false);
    });

    socket.addEventListener("message", (event) => {
        console.log("echo: ", event.data);
    });

    window.addEventListener("gamepadconnected", (e) => {
        console.log(
            "Gamepad %d: %s connected with %d buttons, %d axes",
            e.gamepad.index,
            e.gamepad.id,
            e.gamepad.buttons.length,
            e.gamepad.axes.length,
        );

        if (gamepadHandlerInterval == null) {
            gamepadHandlerInterval = setInterval(gamepadHandler, 20);
        }
    });
    window.addEventListener("gamepaddisconnected", (e) => {
        console.log(
            "Gamepad %d: %s disconnected",
            e.gamepad.index,
            e.gamepad.id,
        );

        if (navigator.getGamepads().length === 0) {
            clearInterval(gamepadHandlerInterval);
        
            gamepadHandlerInterval = null;
        }
    });
</script>
</html>
